<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumo de Preventivas — Jarvis MCLL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#071019;--panel:#0d1720;--panel-2:#111e28;--line:#20313e;--line-soft:#172630;
    --ink:#e8f1f5;--ink-2:#b5c3cb;--ink-3:#718692;--optic:#2ad7e8;--done:#34d399;--danger:#f87171;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 85% 0,#10313b 0,transparent 34%),var(--bg);color:var(--ink);font-family:var(--sans)}
  body{min-height:100vh}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#09131beF;backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .spark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#2af0ff,#0891a5);box-shadow:0 0 18px -5px var(--optic)}
  .spark svg{width:17px;height:17px}
  .brand b{display:block;font-size:15px}.brand small{display:block;color:var(--ink-3);font-size:11px}
  .actions{margin-left:auto;display:flex;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:#13232d;color:var(--ink);font:600 12px var(--sans);text-decoration:none;cursor:pointer}
  .btn:hover{border-color:var(--optic);color:var(--optic)}.btn svg{width:15px;height:15px}
  main{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:24px 0 38px}
  .hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:17px}
  h1{margin:0;font-size:clamp(23px,3vw,34px);letter-spacing:-.6px}.subtitle{margin:6px 0 0;color:var(--ink-3);font-size:13px}
  .sync{font:11px var(--mono);color:var(--ink-3);white-space:nowrap}
  .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
  .metric{padding:15px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(155deg,#13212b,#0b151d)}
  .metric .value{font:700 24px var(--mono);color:var(--optic);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .metric.distance .value{color:var(--done)}.metric .label{margin-top:5px;color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.75px}
  .tools{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .search{flex:1;max-width:460px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#0a141c;color:var(--ink);font:13px var(--sans);outline:none}
  .search:focus{border-color:var(--optic)}.count{margin-left:auto;color:var(--ink-3);font:11px var(--mono)}
  .list{display:flex;flex-direction:column;gap:9px}
  .card{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 15px;border:1px solid var(--line);border-radius:11px;background:#0c1720;box-shadow:0 10px 28px -24px #000}
  .card.off{opacity:.58}.swatch{width:11px;height:46px;border-radius:5px;box-shadow:0 0 13px -4px currentColor}
  .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;color:var(--ink-3);font-size:11px}
  .meta span{display:inline-flex;align-items:center;gap:4px}.status{color:var(--done)!important}.off .status{color:var(--ink-3)!important}
  .distance{text-align:right}.distance strong{display:block;font:700 19px var(--mono);color:var(--done)}.distance small{display:block;margin-top:4px;color:var(--ink-3);font-size:9.5px;max-width:135px}
  .empty{padding:42px 18px;text-align:center;border:1px dashed var(--line);border-radius:11px;color:var(--ink-3);background:#0a141c}
  .error{color:#ffc1bf;border-color:#592a2b;background:#211416}
  @media(max-width:760px){
    header{padding:10px 12px}.brand small{display:none}.actions .label{display:none}
    main{width:min(100% - 20px,1180px);padding-top:18px}.hero{align-items:start;flex-direction:column}.sync{white-space:normal}
    .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric .value{font-size:20px}
    .card{grid-template-columns:9px minmax(0,1fr);align-items:start}.swatch{height:100%}.distance{grid-column:2;text-align:left;display:flex;align-items:baseline;gap:8px}.distance strong{font-size:17px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="spark"><svg viewBox="0 0 24 24" fill="none" stroke="#062b30" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>
    <div><b>Jarvis MCLL</b><small>Preventivas de Rede — Fibra Óptica</small></div>
  </div>
  <div class="actions">
    <button class="btn" id="reload" type="button" aria-label="Atualizar resumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg><span class="label">Atualizar</span></button>
    <a class="btn" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg><span class="label">Voltar ao mapa</span></a>
  </div>
</header>

<main>
  <div class="hero">
    <div><h1>Resumo das preventivas realizadas</h1><p class="subtitle">Distâncias e informações consolidadas dos KMZ secundários.</p></div>
    <div class="sync" id="sync">Carregando dados…</div>
  </div>

  <section class="metrics" aria-label="Indicadores das preventivas">
    <div class="metric"><div class="value" id="totalPrev">—</div><div class="label">Preventivas</div></div>
    <div class="metric distance"><div class="value" id="totalDist">—</div><div class="label">Distância total</div></div>
    <div class="metric distance"><div class="value" id="avgDist">—</div><div class="label">Média por preventiva</div></div>
    <div class="metric"><div class="value" id="totalPoints">—</div><div class="label">Pontos registrados</div></div>
  </section>

  <div class="tools">
    <input class="search" id="search" type="search" placeholder="Buscar preventiva, responsável ou data…" aria-label="Buscar preventivas">
    <div class="count" id="resultCount"></div>
  </div>
  <section class="list" id="list" aria-live="polite"><div class="empty">Carregando preventivas…</div></section>
</main>

<script>
"use strict";
const SUPABASE_URL="https://hhwghwqynrxrksrzjvgc.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_NvNrmOsZBz8PkOzsJCzavQ_3wSiWD2Q";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let preventivas=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function haversine(aLat,aLng,bLat,bLng){const R=6371000,toR=Math.PI/180,dLat=(bLat-aLat)*toR,dLng=(bLng-aLng)*toR;const x=Math.sin(dLat/2)**2+Math.cos(aLat*toR)*Math.cos(bLat*toR)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function routeDistance(gj){
  let meters=0,points=[];
  const walk=coords=>{for(let i=1;i<coords.length;i++){const a=coords[i-1],b=coords[i];meters+=haversine(a[1],a[0],b[1],b[0]);}};
  const lines=g=>{if(!g)return;if(g.type==="LineString")walk(g.coordinates);else if(g.type==="MultiLineString")g.coordinates.forEach(walk);else if(g.type==="GeometryCollection")(g.geometries||[]).forEach(lines);};
  const pts=g=>{if(!g)return;if(g.type==="Point")points.push(g.coordinates);else if(g.type==="MultiPoint")points.push(...g.coordinates);else if(g.type==="GeometryCollection")(g.geometries||[]).forEach(pts);};
  (gj?.features||[]).forEach(f=>lines(f.geometry));
  if(meters>0)return {meters,estimated:false};
  (gj?.features||[]).forEach(f=>pts(f.geometry));walk(points);return {meters,estimated:points.length>1};
}
function stats(gj){let points=0,lines=0;const walk=g=>{if(!g)return;if(g.type==="Point")points++;else if(g.type==="MultiPoint")points+=g.coordinates.length;else if(g.type==="LineString")lines++;else if(g.type==="MultiLineString")lines+=g.coordinates.length;else if(g.type==="GeometryCollection")(g.geometries||[]).forEach(walk);};(gj?.features||[]).forEach(f=>walk(f.geometry));return {points,lines};}
function fmtDist(m){return m>=1000?(m/1000).toFixed(2).replace(".",",")+" km":Math.round(m)+" m";}
function fmtDate(value){if(!value)return "Sem data";const parts=value.split("-");return parts.length===3?parts.reverse().join("/"):value;}
function render(){
  const term=$("search").value.trim().toLocaleLowerCase("pt-BR");
  const rows=preventivas.filter(p=>[p.name,p.ga,p.date].some(v=>String(v||"").toLocaleLowerCase("pt-BR").includes(term)));
  const total=preventivas.reduce((sum,p)=>sum+routeDistance(p.geojson).meters,0);
  const totalPts=preventivas.reduce((sum,p)=>sum+stats(p.geojson).points,0);
  $("totalPrev").textContent=preventivas.length;
  $("totalDist").textContent=total?fmtDist(total):"—";
  $("avgDist").textContent=preventivas.length&&total?fmtDist(total/preventivas.length):"—";
  $("totalPoints").textContent=totalPts;
  $("resultCount").textContent=rows.length+" resultado"+(rows.length===1?"":"s");
  if(!rows.length){$("list").innerHTML='<div class="empty">'+(preventivas.length?"Nenhuma preventiva encontrada.":"Nenhuma preventiva cadastrada.")+'</div>';return;}
  $("list").innerHTML=rows.map(p=>{const distance=routeDistance(p.geojson),s=stats(p.geojson);return `
    <article class="card${p.visible===false?" off":""}">
      <span class="swatch" style="background:${esc(p.color||"#2ad7e8")};color:${esc(p.color||"#2ad7e8")}"></span>
      <div><div class="name">${esc(p.name||"Preventiva sem nome")}</div><div class="meta">
        <span>Data: ${esc(fmtDate(p.date))}</span><span>Responsável: ${esc(p.ga||"Não informado")}</span>
        <span>${s.points} ponto${s.points===1?"":"s"}</span><span>${s.lines} linha${s.lines===1?"":"s"}</span>
        <span class="status">${p.visible===false?"Oculta no mapa":"Visível no mapa"}</span>
      </div></div>
      <div class="distance"><strong>${distance.meters?fmtDist(distance.meters):"—"}</strong><small>${distance.estimated?"estimada entre pontos":distance.meters?"trajeto do KMZ":"sem trajeto calculável"}</small></div>
    </article>`;}).join("");
}
async function load(){
  $("reload").disabled=true;$("sync").textContent="Atualizando dados…";
  try{
    const {data,error}=await db.from("preventivas").select("id,name,date,ga,color,visible,geojson,created_at").order("created_at",{ascending:true});
    if(error)throw error;preventivas=data||[];render();$("sync").textContent="Atualizado em "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }catch(error){console.warn("Erro ao carregar preventivas",error);$("sync").textContent="Falha ao carregar";$("list").innerHTML='<div class="empty error">Não foi possível carregar as preventivas: '+esc(error.message)+'</div>';}
  finally{$("reload").disabled=false;}
}
$("search").addEventListener("input",render);$("reload").onclick=load;load();
</script>
</body>
</html>
